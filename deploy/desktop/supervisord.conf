; Agent desktop processes, all as user "agent" on display :1. Restarted when they exit.
[program:dbus]
command=/usr/bin/dbus-daemon --session --address=unix:path=/tmp/dbus-session --nofork --nopidfile
user=agent
environment=HOME="/home/agent"
priority=1

[program:xvnc]
; VNC listens inside the container only; the browser reaches it through noVNC.
command=/usr/bin/Xvnc :1 -geometry 1280x800 -depth 24 -SecurityTypes None -localhost -AlwaysShared -AcceptSetDesktopSize=0
user=agent
environment=HOME="/home/agent"
priority=10

[program:openbox]
command=/usr/bin/openbox
user=agent
environment=HOME="/home/agent"
priority=20
startretries=10

[program:tint2]
command=/usr/bin/tint2
user=agent
environment=HOME="/home/agent"
priority=30
startretries=10

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5901
user=agent
environment=HOME="/home/agent"
priority=30

[program:notify]
command=/usr/local/bin/notify-log
user=agent
environment=HOME="/home/agent"
priority=30
startretries=10

[program:health]
; Channel check every 5 minutes -> /home/agent/inbox/health.json
command=/usr/local/bin/viber-health --watch 300
user=agent
environment=HOME="/home/agent"
priority=50

[program:viber]
command=/opt/viber/Viber
user=agent
environment=HOME="/home/agent"
priority=40
startretries=20
autorestart=true
stdout_logfile=/home/agent/viber.log
redirect_stderr=true
