# Agent desktop on srv-150: a light virtual computer for agent sessions (Viber first).
# Own compose project; noVNC on host loopback only (reach it through an SSH tunnel); the home folder with the
# app profiles (Viber login, history) lives in a named volume and survives rebuilds.
#   docker compose -f deploy/desktop/compose.yml up -d --build
name: desktop

services:
  desktop:
    build: .
    image: agent-desktop:local
    container_name: agent-desktop
    hostname: agent-desktop
    restart: unless-stopped
    environment:
      TZ: Europe/Warsaw
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - home:/home/agent
    shm_size: 256m
    mem_limit: 1200m
    memswap_limit: 2400m
    cpus: 0.9
    pids_limit: 400
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  home:
