# Stream on srv-150, isolated from other projects:
# own compose project and network, own system user, own directory /srv/stream,
# no capabilities, read-only filesystem, port published on host loopback only.
name: stream

services:
  stream:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: stream:local
    restart: unless-stopped
    user: "${STREAM_UID:?set in /srv/stream/.env}:${STREAM_GID:?set in /srv/stream/.env}"
    env_file: /srv/stream/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3790"
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3790:3790"
    volumes:
      - /srv/stream/data:/data
      - /srv/stream/backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
