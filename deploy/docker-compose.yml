# Stream on srv-150, isolated from other projects:
# own compose project and network, own system user, own directory /srv/stream,
# no capabilities, read-only filesystem, port published on host loopback only.
name: stream

services:
  stream:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: stream:local
    restart: unless-stopped
    user: "${STREAM_UID:?set in /srv/stream/.env}:${STREAM_GID:?set in /srv/stream/.env}"
    env_file: /srv/stream/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3790"
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3790:3790"
    volumes:
      - /srv/stream/data:/data
      - /srv/stream/backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Telegram account gateways (CONCEPT.md §8.2, deploy/TELEGRAM.md). No env_file: each gets only its own
  # token and the shared api_id, never the owner token. Until the owner logs in they report «нужен вход».
  tg-by: &gateway
    build:
      context: ../gateway/telegram
    image: stream-tg:local
    restart: unless-stopped
    user: "${STREAM_UID:?set in /srv/stream/.env}:${STREAM_GID:?set in /srv/stream/.env}"
    environment:
      TG_ACCOUNT: by
      TG_API_ID: "${TG_API_ID:-}"
      TG_API_HASH: "${TG_API_HASH:-}"
      STREAM_URL: http://stream:3790
      STREAM_GATEWAY_TOKEN: "${STREAM_TG_BY_TOKEN:?set in /srv/stream/.env}"
    volumes:
      - /srv/stream/tg/by:/state
    depends_on: [stream]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.3
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tg-pl:
    <<: *gateway
    environment:
      TG_ACCOUNT: pl
      TG_API_ID: "${TG_API_ID:-}"
      TG_API_HASH: "${TG_API_HASH:-}"
      STREAM_URL: http://stream:3790
      STREAM_GATEWAY_TOKEN: "${STREAM_TG_PL_TOKEN:?set in /srv/stream/.env}"
    volumes:
      - /srv/stream/tg/pl:/state
