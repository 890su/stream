<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)">
  <title>Stream — личная лента</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/v/__BUILD__/styles.css">
  <script type="module" src="/v/__BUILD__/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>Stream</h1>
      <p id="network" role="status">подключение…</p>
    </div>
    <button id="menu-button" type="button" class="icon-button" aria-label="Настройки" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
  </header>

  <main id="messages" aria-label="Лента сообщений" tabindex="-1">
    <div id="history-state" class="service-pill" hidden></div>
    <div id="feed-list" role="log" aria-live="polite"></div>
  </main>

  <div id="notice" class="toast" role="status" aria-live="polite" hidden><span id="notice-text"></span><button id="notice-action" type="button" hidden></button></div>

  <div id="action-layer" class="action-layer" hidden></div>
  <div id="action-panel" class="action-panel" hidden role="menu" aria-label="Действия с сообщением">
    <button type="button" role="menuitem" data-op="reply" aria-label="Ответить">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 4 12l6 6"/><path d="M4.5 12H14a6 6 0 0 1 6 6v1"/></svg><span>Ответить</span></button>
    <button type="button" role="menuitem" data-op="edit" aria-label="Изменить">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg><span>Изменить</span></button>
    <button type="button" role="menuitem" data-op="copy" aria-label="Копировать текст">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg><span>Копировать</span></button>
    <button type="button" role="menuitem" data-op="link" aria-label="Связать с предыдущим сообщением">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Связать</span></button>
    <button type="button" role="menuitem" data-op="archive" aria-label="В архив">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1"/><path d="M5 9v9.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/></svg><span>В архив</span></button>
    <button type="button" role="menuitem" data-op="delete" class="danger" aria-label="Удалить">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15M9.5 6.5V4.8a.8.8 0 0 1 .8-.8h3.4a.8.8 0 0 1 .8.8v1.7M6.5 6.5l.8 12.2a1.5 1.5 0 0 0 1.5 1.3h6.4a1.5 1.5 0 0 0 1.5-1.3l.8-12.2M10 10.5v6M14 10.5v6"/></svg><span>Удалить</span></button>
  </div>

  <footer class="composer-area">
    <div id="tag-panel" class="panel" hidden aria-label="Метки">
      <p class="panel-title">Все метки</p>
      <div id="tag-options" class="chips"></div>
      <form id="new-tag-form" class="new-tag" autocomplete="off">
        <label class="visually-hidden" for="new-tag">Новая метка</label>
        <input id="new-tag" type="text" placeholder="#новая-метка" maxlength="40" enterkeyhint="done">
        <button type="submit" class="link-button">Добавить</button>
      </form>
    </div>
    <div id="attach-menu" class="panel attach-menu" hidden aria-label="Прикрепить">
      <button type="button" data-attach="camera"><span class="round">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5 7.6 6.5H5A2.5 2.5 0 0 0 2.5 9v8.5A2.5 2.5 0 0 0 5 20h14a2.5 2.5 0 0 0 2.5-2.5V9A2.5 2.5 0 0 0 19 6.5h-2.6L15 4.5H9Z"/><circle cx="12" cy="13" r="3.6"/></svg>
      </span>Камера</button>
      <button type="button" data-attach="gallery"><span class="round">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="m4 17.5 5-5 3.5 3.5 2.5-2.5 5 5"/></svg>
      </span>Галерея</button>
      <button type="button" data-attach="file"><span class="round">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg>
      </span>Файл</button>
    </div>
    <div id="context-bar" class="context-bar" hidden>
      <svg id="context-icon-reply" class="context-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 4 12l6 6"/><path d="M4.5 12H14a6 6 0 0 1 6 6v1"/></svg>
      <svg id="context-icon-continue" class="context-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v8a4 4 0 0 0 4 4h9"/><path d="m15 12 4 4-4 4"/></svg>
      <svg id="context-icon-edit" class="context-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
      <div class="context-text"><span id="context-title"></span><span id="context-snippet"></span></div>
      <button id="context-cancel" type="button" class="icon-button" aria-label="Отменить">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="draft" class="draft" hidden>
      <div id="draft-files" class="draft-files"></div>
    </div>
    <div id="tag-row" class="tag-row" role="group" aria-label="Метки сообщения: касание включает или выключает" hidden></div>
    <form id="composer" class="composer" autocomplete="off">
      <button id="tag-button" type="button" class="icon-button" aria-label="Метки" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5 7.5 20.5M16.5 3.5l-2 17M4 8.5h16.5M3.5 15.5H20"/></svg>
      </button>
      <div id="recording-bar" class="recording-bar" hidden>
        <span class="rec-dot" aria-hidden="true"></span>
        <span id="rec-time" class="rec-time">0:00</span>
        <button id="rec-cancel" type="button" class="link-button">Отмена</button>
      </div>
      <label class="visually-hidden" for="message">Сообщение</label>
      <textarea id="message" rows="1" placeholder="Сообщение" enterkeyhint="enter"></textarea>
      <button id="attach-button" type="button" class="icon-button" aria-label="Прикрепить фото или файл" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.5 11.5-8.2 8.2a5.3 5.3 0 0 1-7.5-7.5l8.6-8.6a3.5 3.5 0 0 1 5 5l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l7.9-7.9"/></svg>
      </button>
      <button id="action-button" type="button" class="action-button" aria-label="Голосовое сообщение" data-mode="voice">
        <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
        <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12l-11.7 1.9.1 6.5Z"/></svg>
      </button>
    </form>
    <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
    <input id="gallery-input" type="file" accept="image/*" multiple hidden>
    <input id="file-input" type="file" multiple hidden>
  </footer>

  <dialog id="viewer" class="viewer" aria-label="Фото">
    <img id="viewer-image" alt="">
    <button id="viewer-close" type="button" class="icon-button" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </dialog>

  <dialog id="topic" aria-labelledby="topic-heading">
    <form id="topic-form" method="dialog">
      <h2 id="topic-heading">Тема</h2>
      <label for="topic-title">Название</label>
      <input id="topic-title" type="text" maxlength="80" autocomplete="off" enterkeyhint="done">
      <p id="topic-hint" class="hint"></p>
      <div class="dialog-actions">
        <button id="topic-detach" type="button" class="link-button danger-link">Отделить сообщение</button>
        <button id="topic-cancel" type="button" class="link-button">Отмена</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="thread" class="thread" aria-labelledby="thread-title">
    <header class="thread-head">
      <h2 id="thread-title">История сообщения</h2>
      <button id="thread-close" type="button" class="icon-button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div id="thread-list" class="thread-list"></div>
  </dialog>

  <dialog id="settings" aria-labelledby="settings-title">
    <form id="token-form" method="dialog">
      <h2 id="settings-title">Доступ</h2>
      <label for="owner-token">Токен владельца</label>
      <input id="owner-token" type="password" autocomplete="off" spellcheck="false">
      <p class="hint">Токен хранится только в этом браузере. Без сети записи ждут на устройстве и уходят сами.</p>
      <label class="switch-row"><input id="show-archive" type="checkbox"> Показывать архив</label>
      <p id="queue-count" class="hint" role="status"></p>
      <div class="dialog-actions">
        <button id="settings-close" type="button" class="link-button">Закрыть</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </dialog>
  <noscript>Для записи и офлайн-очереди включите JavaScript.</noscript>
</body>
</html>
