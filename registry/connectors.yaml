# Connectors: where actions go. A connector receives an Action (contracts/action.schema.json),
# returns a result, never reads the feed and never calls AI.

version: 1

connectors:
  internal_tasks:
    status: mvp
    title: Встроенный менеджер задач
    operations: [create_task, change_task]
    notes: Пишет события task_change в журнал; задача — проекция.

  internal_ledger:
    status: mvp
    title: Лог расходов и доходов
    operations: [record_expense, record_income]
    notes: Запись в ленте с полями; отчёт — фильтр. Выгрузка за месяц — после MVP.

  todoist:
    status: reserve
    title: Todoist (зеркало задач)
    operations: [create_task, update_task, close_task]
    notes: API v1, personal token в .env (TODOIST_TOKEN). Включать только по решению владельца.

  ticktick:
    status: reserve
    title: TickTick (зеркало задач)
    operations: [create_task, update_task, complete_task]
    notes: Официальный Open API маленький (без тегов и поиска). Второй резерв после Todoist.

  icrm:
    status: later
    title: iCRM (заявки, оплаты, клиенты)
    operations: []
    notes: Отдельный коннектор после MVP; до этого лента и iCRM не связаны (decisions.md, 2026-11-11).

  planfix:
    status: later
    title: Планфикс
    operations: []
    notes: REST API только на платном тарифе; писать с silent=true.

  email:
    status: later
    title: Почта
    operations: []

  telegram_by:
    status: planned
    title: Telegram BY (бот аккаунта)
    operations: [send_message]
    irreversible: [send_message]
    notes: >-
      Бизнес-бот «Stream BY», подключённый к аккаунту (CONCEPT.md §8.2); сервер шлёт sendMessage с
      business_connection_id. send_message — класс C, только после подтверждения; только личные чаты с входящим
      за 24 часа. params: chat_id, text, reply_to_message_id. Сфера — работа BY.

  telegram_pl:
    status: planned
    title: Telegram PL (бот аккаунта)
    operations: [send_message]
    irreversible: [send_message]
    notes: Как telegram_by, бот «Stream PL»; сфера — работа PL.

  whatsapp_pl:
    status: planned
    title: WhatsApp PL (связанное устройство)
    operations: [send_message]
    irreversible: [send_message]
    notes: >-
      Baileys связанным устройством на номере владельца, в процессе Stream (docs/plans/2026-11-20-whatsapp-baileys-design.md).
      send_message — класс C, только после подтверждения; только ответы и только по номеру (params.chat_id = +номер),
      сомнительная отправка не повторяется. Сфера — работа PL.

  sms:
    status: planned
    title: SMS (телефон «Stream · телефон»)
    operations: [send_message]
    irreversible: [send_message]
    notes: >-
      Отправляет приложение на телефоне владельца (CONCEPT.md §8.1, 2026-11-25): забирает действие
      /api/phone/actions/next, шлёт с SIM последнего SMS этого номера и сообщает итог. send_message — класс C, только
      ответы и только по номеру (params.chat_id); взятое и не подтверждённое за 10 минут не повторяется.

  google_calendar:
    status: planned
    title: Google Календарь (два аккаунта владельца)
    operations: []
    irreversible: []
    notes: >-
      Вход через Google в своём проекте Google Cloud (deploy/GOOGLE.md). Этап 1 — календари владельца видны в «Плане»;
      этап 2 — календарь «Stream» синхронизируется с задачами (docs/plans/2026-11-20-google-calendar-design.md).

  google_reviews:
    status: later
    title: Отзывы Google Business Profile
    operations: []
    notes: Нужен одобренный доступ к API; профиль подтверждён и активен ≥60 дней.
